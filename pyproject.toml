# The scripts run in place (python schematics/<name>.py, python tests/.../plot.py).
# Installing the repository installs their dependencies and the small package
# photchem_method (paths, reduced, provenance, check) that the tests/ scripts import:
#     pip install -e .            numpy, matplotlib, healpy, photchem_method
#     pip install -e ".[slides]"  plus python-pptx for make_cr_slides.py
#     pip install -e ".[tests]"   plus what the tests/ harnesses read
# Several harnesses also read Athena++/Tigris output with athena_read.py from the
# code's vis/python directory, which is not on PyPI.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "photchem-method"
version = "0.1"
description = "Figures and test-problem harnesses for the TIGRESS++ photochemistry method"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "healpy",
]

[project.optional-dependencies]
slides = ["python-pptx"]
tests = [
    "pandas",
    "pyathena @ git+https://github.com/jeonggyukim/pyathena.git",
]

[tool.setuptools]
packages = ["photchem_method"]
